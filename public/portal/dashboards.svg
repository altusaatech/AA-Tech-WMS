<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6fff"/>
      <stop offset="0.55" stop-color="#17b3e8"/>
      <stop offset="1" stop-color="#33f0bf"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- monitor frame -->
    <rect x="52" y="76" width="408" height="312" rx="30"/>
    <!-- baseline -->
    <line x1="36" y1="436" x2="476" y2="436"/>
    <!-- bars (rise through the monitor's bottom edge to the baseline) -->
    <path d="M78 340 h58 v96 h-58 z" fill="#f7f7f7"/>
    <path d="M182 244 h58 v192 h-58 z" fill="#f7f7f7"/>
    <path d="M286 310 h58 v126 h-58 z" fill="#f7f7f7"/>
    <path d="M390 226 h58 v210 h-58 z" fill="#f7f7f7"/>
    <!-- trend line between the nodes -->
    <line x1="126" y1="238" x2="192" y2="172"/>
    <line x1="232" y1="174" x2="296" y2="238"/>
    <line x1="336" y1="236" x2="398" y2="174"/>
    <!-- nodes -->
    <circle cx="107" cy="256" r="26" fill="#f7f7f7"/>
    <circle cx="211" cy="155" r="26" fill="#f7f7f7"/>
    <circle cx="315" cy="256" r="26" fill="#f7f7f7"/>
    <circle cx="417" cy="155" r="26" fill="#f7f7f7"/>
  </g>
</svg>
